<!DOCTYPE html>
<html lang="en" data-theme="light" data-accent="orange">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Church OS — Super Admin UI Preview</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --radius-xs: 8px;
      --radius-sm: 12px;
      --radius-md: 16px;
      --radius-lg: 22px;
      --radius-xl: 30px;
      --sidebar-width: 284px;
      --sidebar-collapsed: 82px;
      --ease: cubic-bezier(.2,.8,.2,1);
      --shadow-soft: 0 22px 70px rgba(15, 23, 42, .08);
      --shadow-card: 0 14px 40px rgba(15, 23, 42, .07);
      --success: #16a34a;
      --success-soft: rgba(22, 163, 74, .12);
      --warning: #d97706;
      --warning-soft: rgba(217, 119, 6, .14);
      --danger: #dc2626;
      --danger-soft: rgba(220, 38, 38, .12);
      --info: #2563eb;
      --info-soft: rgba(37, 99, 235, .12);
      --purple: #7c3aed;
      --purple-soft: rgba(124, 58, 237, .12);
      --pink: #db2777;
      --pink-soft: rgba(219, 39, 119, .12);
    }

    html[data-theme="light"] {
      --bg: #f7f5f1;
      --bg-2: #fbfaf7;
      --surface: rgba(255,255,255,.84);
      --surface-strong: #ffffff;
      --surface-raised: #ffffff;
      --sidebar: rgba(255,255,255,.76);
      --border: rgba(15, 23, 42, .09);
      --border-strong: rgba(15, 23, 42, .13);
      --text: #18202f;
      --muted: #667085;
      --muted-2: #98a2b3;
      --inverse: #ffffff;
      --gridline: rgba(15, 23, 42, .08);
      --glass: rgba(255, 255, 255, .72);
      --backdrop: rgba(15, 23, 42, .44);
    }

    html[data-theme="dark"] {
      --bg: #111723;
      --bg-2: #151d2b;
      --surface: rgba(24, 33, 48, .82);
      --surface-strong: #182130;
      --surface-raised: #1d2839;
      --sidebar: rgba(20, 28, 42, .82);
      --border: rgba(226, 232, 240, .09);
      --border-strong: rgba(226, 232, 240, .15);
      --text: #f5f7fb;
      --muted: #a7b0c2;
      --muted-2: #707c91;
      --inverse: #111723;
      --gridline: rgba(226, 232, 240, .08);
      --glass: rgba(24, 33, 48, .74);
      --shadow-soft: 0 22px 70px rgba(0, 0, 0, .24);
      --shadow-card: 0 14px 40px rgba(0, 0, 0, .18);
      --backdrop: rgba(0, 0, 0, .56);
    }

    html[data-accent="orange"] { --accent: #f97316; --accent-2: #fb923c; --accent-soft: rgba(249, 115, 22, .14); --accent-shadow: rgba(249, 115, 22, .28); }
    html[data-accent="blue"] { --accent: #2563eb; --accent-2: #60a5fa; --accent-soft: rgba(37, 99, 235, .14); --accent-shadow: rgba(37, 99, 235, .28); }
    html[data-accent="purple"] { --accent: #7c3aed; --accent-2: #a78bfa; --accent-soft: rgba(124, 58, 237, .14); --accent-shadow: rgba(124, 58, 237, .28); }
    html[data-accent="green"] { --accent: #16a34a; --accent-2: #4ade80; --accent-soft: rgba(22, 163, 74, .14); --accent-shadow: rgba(22, 163, 74, .28); }
    html[data-accent="red"] { --accent: #dc2626; --accent-2: #f87171; --accent-soft: rgba(220, 38, 38, .14); --accent-shadow: rgba(220, 38, 38, .28); }
    html[data-accent="pink"] { --accent: #db2777; --accent-2: #f472b6; --accent-soft: rgba(219, 39, 119, .14); --accent-shadow: rgba(219, 39, 119, .28); }
    html[data-accent="gray"] { --accent: #475569; --accent-2: #94a3b8; --accent-soft: rgba(71, 85, 105, .14); --accent-shadow: rgba(71, 85, 105, .28); }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      background:
        radial-gradient(circle at top left, var(--accent-soft), transparent 34rem),
        radial-gradient(circle at 78% 14%, rgba(14, 165, 233, .12), transparent 28rem),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    .app-shell {
      display: grid;
      grid-template-columns: var(--sidebar-width) 1fr;
      min-height: 100vh;
      transition: grid-template-columns .24s var(--ease);
    }
    .app-shell.collapsed { grid-template-columns: var(--sidebar-collapsed) 1fr; }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 16px 14px;
      border-right: 1px solid var(--border);
      background: var(--sidebar);
      backdrop-filter: blur(24px);
      display: flex;
      flex-direction: column;
      gap: 18px;
      z-index: 25;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 48px;
      padding: 8px 8px 8px 10px;
      border-radius: var(--radius-md);
    }
    .brand-mark {
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, var(--accent), var(--accent-2));
      color: white;
      box-shadow: 0 16px 34px var(--accent-shadow);
      position: relative;
      overflow: hidden;
    }
    .brand-mark:after {
      content: "";
      position: absolute;
      width: 48px;
      height: 48px;
      border: 1px solid rgba(255,255,255,.35);
      transform: rotate(35deg);
      border-radius: 16px;
    }
    .brand-text { overflow: hidden; white-space: nowrap; }
    .brand-text strong { display: block; letter-spacing: -.03em; font-size: 15px; }
    .brand-text span { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
    .app-shell.collapsed .brand-text,
    .app-shell.collapsed .nav-section-title,
    .app-shell.collapsed .nav-label,
    .app-shell.collapsed .sidebar-footer-text,
    .app-shell.collapsed .status-card-content { display: none; }
    .collapse-btn {
      position: absolute;
      right: -15px;
      top: 22px;
      width: 30px;
      height: 30px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-strong);
      color: var(--muted);
      display: grid;
      place-items: center;
      box-shadow: var(--shadow-card);
    }
    .nav-scroll { overflow: auto; padding-right: 4px; }
    .nav-scroll::-webkit-scrollbar { width: 6px; }
    .nav-scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; }
    .nav-section { margin: 11px 0 18px; }
    .nav-section-title {
      color: var(--muted-2);
      text-transform: uppercase;
      letter-spacing: .13em;
      font-weight: 700;
      font-size: 10px;
      padding: 0 10px 8px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 11px;
      height: 38px;
      padding: 0 11px;
      border-radius: 12px;
      color: var(--muted);
      margin: 2px 0;
      border: 1px solid transparent;
      transition: background .16s ease, color .16s ease, border .16s ease;
      position: relative;
    }
    .nav-item i, .nav-item svg { width: 18px; height: 18px; flex: 0 0 auto; }
    .nav-item:hover { background: var(--accent-soft); color: var(--text); }
    .nav-item.active {
      background: linear-gradient(90deg, var(--accent-soft), transparent 88%);
      border-color: color-mix(in srgb, var(--accent) 18%, transparent);
      color: var(--text);
    }
    .nav-item.active:before {
      content: "";
      position: absolute;
      left: 4px;
      width: 4px;
      height: 18px;
      border-radius: 999px;
      background: var(--accent);
    }
    .nav-label { white-space: nowrap; font-size: 13px; font-weight: 650; }
    .sidebar-footer { margin-top: auto; display: grid; gap: 10px; }
    .status-card {
      padding: 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--glass);
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 58px;
    }
    .status-dot { width: 9px; height: 9px; background: var(--success); border-radius: 999px; box-shadow: 0 0 0 5px var(--success-soft); }
    .status-card strong { display: block; font-size: 12px; }
    .status-card span { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }

    .main { min-width: 0; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 18;
      height: 74px;
      border-bottom: 1px solid var(--border);
      background: var(--glass);
      backdrop-filter: blur(24px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 0 26px;
    }
    .mobile-menu { display: none; }
    .title-group { min-width: 180px; }
    .title-group .crumb { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .title-group h1 { margin: 4px 0 0; font-size: 18px; letter-spacing: -.035em; }
    .search-wrap { position: relative; flex: 1; max-width: 720px; min-width: 240px; }
    .search-wrap i, .search-wrap svg { position: absolute; width: 17px; height: 17px; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted-2); }
    .global-search {
      width: 100%; height: 42px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 999px;
      padding: 0 18px 0 40px;
      outline: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
    }
    .global-search:focus { border-color: color-mix(in srgb, var(--accent) 42%, var(--border)); box-shadow: 0 0 0 4px var(--accent-soft); }
    .search-results {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 10px);
      background: var(--surface-strong);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      max-height: 430px;
      z-index: 60;
    }
    .search-results.show { display: block; }
    .result-group { padding: 12px; border-bottom: 1px solid var(--border); }
    .result-group:last-child { border-bottom: 0; }
    .result-group h4 { margin: 0 0 8px; font-size: 11px; color: var(--muted-2); text-transform: uppercase; letter-spacing: .12em; }
    .result-item { padding: 8px 10px; border-radius: 11px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .result-item:hover { background: var(--accent-soft); }
    .result-item span { font-size: 13px; font-weight: 650; }
    .result-item small { color: var(--muted); }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .btn {
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 14px;
      font-weight: 750;
      font-size: 13px;
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
      white-space: nowrap;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(15, 23, 42, .06); }
    .btn svg { width: 17px; height: 17px; }
    .btn.primary { background: linear-gradient(145deg, var(--accent), var(--accent-2)); border-color: transparent; color: white; box-shadow: 0 12px 28px var(--accent-shadow); }
    .btn.danger { background: var(--danger-soft); border-color: rgba(220, 38, 38, .22); color: var(--danger); }
    .btn.ghost { background: transparent; }
    .icon-btn {
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      display: grid;
      place-items: center;
    }
    .icon-btn svg { width: 18px; height: 18px; }
    .profile-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 6px 4px 4px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      min-width: 126px;
    }
    .avatar {
      width: 32px; height: 32px; border-radius: 999px;
      background: linear-gradient(145deg, #111827, #64748b);
      color: white; display: grid; place-items: center; font-weight: 850; font-size: 12px;
    }
    .profile-pill span { font-size: 12px; font-weight: 800; }
    .accent-popover {
      position: absolute;
      top: 62px;
      right: 92px;
      padding: 10px;
      display: none;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      background: var(--surface-strong);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow-soft);
      z-index: 80;
    }
    .accent-popover.show { display: grid; }
    .swatch {
      width: 28px; height: 28px; border-radius: 999px;
      border: 3px solid var(--surface-strong);
      box-shadow: 0 0 0 1px var(--border);
    }
    .swatch[data-color="orange"] { background: #f97316; }
    .swatch[data-color="blue"] { background: #2563eb; }
    .swatch[data-color="purple"] { background: #7c3aed; }
    .swatch[data-color="green"] { background: #16a34a; }
    .swatch[data-color="red"] { background: #dc2626; }
    .swatch[data-color="pink"] { background: #db2777; }
    .swatch[data-color="gray"] { background: #475569; }

    .content { padding: 26px; }
    .page { display: none; animation: fadeIn .22s ease both; }
    .page.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      background:
        linear-gradient(135deg, var(--surface-strong), var(--surface)),
        radial-gradient(circle at 85% 20%, var(--accent-soft), transparent 20rem);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      position: relative;
    }
    .hero:before {
      content: "";
      position: absolute;
      right: -88px;
      top: -130px;
      width: 280px;
      height: 280px;
      border: 44px solid var(--accent-soft);
      border-radius: 999px;
      pointer-events: none;
    }
    .eyebrow { display: inline-flex; align-items: center; gap: 8px; color: var(--accent); font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .12em; }
    .eyebrow svg { width: 15px; height: 15px; }
    .hero h2 { margin: 10px 0 8px; font-size: clamp(26px, 4vw, 42px); line-height: 1.02; letter-spacing: -.055em; }
    .hero p { max-width: 780px; margin: 0; color: var(--muted); line-height: 1.65; }
    .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }

    .grid { display: grid; gap: 16px; }
    .kpi-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 18px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      padding: 18px;
      min-width: 0;
    }
    .kpi-card {
      position: relative;
      overflow: hidden;
      min-height: 140px;
    }
    .kpi-card:after {
      content: "";
      position: absolute;
      right: -36px;
      bottom: -42px;
      width: 110px;
      height: 110px;
      border-radius: 999px;
      background: var(--accent-soft);
    }
    .kpi-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; position: relative; z-index: 1; }
    .kpi-icon { width: 36px; height: 36px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
    .kpi-icon svg { width: 18px; height: 18px; }
    .kpi-label { color: var(--muted); font-size: 12px; font-weight: 750; }
    .kpi-value { margin-top: 18px; font-size: 30px; letter-spacing: -.055em; font-weight: 850; position: relative; z-index: 1; }
    .trend { margin-top: 7px; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; position: relative; z-index: 1; }
    .trend.good { color: var(--success); }
    .trend.warn { color: var(--warning); }
    .trend.bad { color: var(--danger); }
    .chart-grid { grid-template-columns: 1.3fr .7fr; margin-top: 16px; }
    .section-title { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
    .section-title h3 { margin: 0; font-size: 16px; letter-spacing: -.025em; }
    .section-title p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .pill-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .pill, .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 26px;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      border: 1px solid var(--border);
      background: var(--surface-strong);
      color: var(--muted);
      white-space: nowrap;
    }
    .badge.success { color: var(--success); background: var(--success-soft); border-color: rgba(22, 163, 74, .18); }
    .badge.warning { color: var(--warning); background: var(--warning-soft); border-color: rgba(217, 119, 6, .18); }
    .badge.danger { color: var(--danger); background: var(--danger-soft); border-color: rgba(220, 38, 38, .18); }
    .badge.info { color: var(--info); background: var(--info-soft); border-color: rgba(37, 99, 235, .18); }
    .badge.purple { color: var(--purple); background: var(--purple-soft); border-color: rgba(124, 58, 237, .18); }
    .badge.pink { color: var(--pink); background: var(--pink-soft); border-color: rgba(219, 39, 119, .18); }
    .badge.neutral { color: var(--muted); background: color-mix(in srgb, var(--muted) 10%, transparent); }
    .canvas-wrap { height: 290px; position: relative; }
    canvas { width: 100%; height: 100%; display: block; }
    .mini-chart-row { display: grid; gap: 13px; }
    .bar-row { display: grid; grid-template-columns: 128px 1fr 44px; align-items: center; gap: 10px; font-size: 12px; }
    .bar-row span:first-child { color: var(--muted); font-weight: 650; }
    .bar-track { height: 10px; background: color-mix(in srgb, var(--muted) 12%, transparent); border-radius: 999px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent-2)); width: var(--w); }
    .donut-zone { display: grid; grid-template-columns: 160px 1fr; gap: 16px; align-items: center; }
    .donut {
      width: 150px; height: 150px; border-radius: 999px;
      background: conic-gradient(var(--accent) 0 34%, #38bdf8 34% 55%, #a78bfa 55% 70%, #22c55e 70% 82%, #f59e0b 82% 92%, #94a3b8 92% 100%);
      position: relative;
      margin: auto;
      box-shadow: inset 0 0 0 1px var(--border), 0 18px 35px rgba(15,23,42,.08);
    }
    .donut:after { content: ""; position: absolute; inset: 24px; border-radius: inherit; background: var(--surface-strong); }
    .donut-center { position: absolute; inset: 0; display: grid; place-items: center; z-index: 1; text-align: center; font-weight: 850; letter-spacing: -.04em; }
    .donut-center small { display: block; color: var(--muted); font-size: 11px; font-weight: 750; letter-spacing: 0; margin-top: 4px; }
    .legend { display: grid; gap: 9px; }
    .legend-item { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--muted); }
    .legend-item:before { content: ""; width: 10px; height: 10px; border-radius: 999px; background: var(--accent); margin-top: 4px; flex: 0 0 auto; }
    .legend-item:nth-child(2):before { background: #38bdf8; }
    .legend-item:nth-child(3):before { background: #a78bfa; }
    .legend-item:nth-child(4):before { background: #22c55e; }
    .legend-item:nth-child(5):before { background: #f59e0b; }
    .legend-item:nth-child(6):before { background: #94a3b8; }
    .panel-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 16px; }
    .list { display: grid; gap: 10px; }
    .list-item { display: flex; gap: 10px; align-items: flex-start; padding: 11px; border-radius: var(--radius-sm); background: color-mix(in srgb, var(--surface-strong) 70%, transparent); border: 1px solid var(--border); }
    .list-icon { width: 28px; height: 28px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: 0 0 auto; }
    .list-icon svg { width: 15px; height: 15px; }
    .list-item strong { display: block; font-size: 13px; }
    .list-item span { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; line-height: 1.4; }

    .page-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
      margin-bottom: 16px;
    }
    .page-header h2 { margin: 0; font-size: 28px; letter-spacing: -.055em; }
    .page-header p { margin: 7px 0 0; color: var(--muted); line-height: 1.55; max-width: 720px; }
    .filter-bar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      margin-bottom: 16px;
    }
    .filter-chip, select.input, input.input {
      height: 36px;
      border: 1px solid var(--border);
      background: var(--surface-strong);
      color: var(--text);
      border-radius: 999px;
      padding: 0 12px;
      font-size: 12px;
      font-weight: 750;
      outline: none;

    function drawLineChart(canvas, data, labels, color){
      if(!canvas) return;
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.max(1, rect.width * dpr); canvas.height = Math.max(1, rect.height * dpr);
      const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
      const w = rect.width, h = rect.height;
      ctx.clearRect(0,0,w,h);
      const pad = 34;
      const max = Math.max(...data) * 1.15;
      const min = 0;
      ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--gridline');
      ctx.lineWidth = 1;
      for(let i=0;i<5;i++){ const y = pad + (h-pad*2)*(i/4); ctx.beginPath(); ctx.moveTo(pad,y); ctx.lineTo(w-pad,y); ctx.stroke(); }
      const points = data.map((v,i)=>({x:pad + (w-pad*2)*(i/(data.length-1)), y:h-pad - ((v-min)/(max-min))*(h-pad*2)}));
      const gradient = ctx.createLinearGradient(0,pad,0,h-pad);
      gradient.addColorStop(0, color.replace(')', ', .28)').replace('rgb', 'rgba'));
      gradient.addColorStop(1, color.replace(')', ', 0)').replace('rgb', 'rgba'));
      ctx.beginPath(); ctx.moveTo(points[0].x, h-pad); points.forEach(p=>ctx.lineTo(p.x,p.y)); ctx.lineTo(points[points.length-1].x,h-pad); ctx.closePath(); ctx.fillStyle = gradient; ctx.fill();
      ctx.beginPath(); points.forEach((p,i)=> i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
      points.forEach((p,i)=>{ ctx.beginPath(); ctx.arc(p.x,p.y,4,0,Math.PI*2); ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--surface-strong'); ctx.fill(); ctx.strokeStyle=color; ctx.lineWidth=2; ctx.stroke(); ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--muted'); ctx.font='11px Inter, sans-serif'; ctx.textAlign='center'; ctx.fillText(labels[i], p.x, h-9); });
    }
    function drawBarChart(canvas, data, labels, color){
      if(!canvas) return;
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.max(1, rect.width * dpr); canvas.height = Math.max(1, rect.height * dpr);
      const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
      const w = rect.width, h = rect.height;
      ctx.clearRect(0,0,w,h);
      const pad = 34, gap=16;
      const max = Math.max(...data)*1.15;
      const barW = (w-pad*2-gap*(data.length-1))/data.length;
      data.forEach((v,i)=>{
        const x = pad + i*(barW+gap); const bh = (v/max)*(h-pad*2); const y = h-pad-bh;
        const grd = ctx.createLinearGradient(0,y,0,h-pad); grd.addColorStop(0, color); grd.addColorStop(1, getComputedStyle(document.documentElement).getPropertyValue('--accent-2'));
        roundRect(ctx,x,y,barW,bh,10); ctx.fillStyle = grd; ctx.fill();
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--muted'); ctx.font='11px Inter, sans-serif'; ctx.textAlign='center'; ctx.fillText(labels[i], x+barW/2, h-9);
      });
    }
    function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

    }

    function enhanceSelects(root = document){
      $$('select:not([data-enhanced])', root).forEach(select=>{
        select.dataset.enhanced = 'true';
        const isPill = select.classList.contains('input');
        select.classList.add('native-select-hidden');
        const wrap = document.createElement('div');
        wrap.className = `select-pro ${isPill ? 'select-pill' : ''}`;
        const trigger = document.createElement('button');
        trigger.type = 'button';
        trigger.className = 'select-trigger';
        const value = document.createElement('span');
        value.className = 'select-value';
        const chev = document.createElement('span');
        chev.className = 'select-chevron';
        chev.innerHTML = icon('chevron-down');
        trigger.append(value, chev);
        const menu = document.createElement('div');
        menu.className = 'select-menu';
        wrap.append(trigger, menu);
        select.insertAdjacentElement('afterend', wrap);
        function renderOptions(){
          value.textContent = select.options[select.selectedIndex]?.text || select.value || 'Select';
          menu.innerHTML = Array.from(select.options).map((opt, idx)=>`<button type="button" class="select-option ${idx===select.selectedIndex?'active':''}" data-value="${opt.value || opt.text}"><span>${opt.text}</span><span class="option-check">${icon('check')}</span></button>`).join('');
          refreshIcons();
        }
        trigger.addEventListener('click', e=>{
          e.stopPropagation();
          $$('.select-pro.open').forEach(x=>{ if(x!==wrap) x.classList.remove('open'); });
          wrap.classList.toggle('open');
        });
        menu.addEventListener('click', e=>{
          const option = e.target.closest('.select-option'); if(!option) return;
          const idx = Array.from(menu.children).indexOf(option);
          select.selectedIndex = idx;
          select.dispatchEvent(new Event('change', {bubbles:true}));
          wrap.classList.remove('open');
          renderOptions();
        });
        select.addEventListener('change', renderOptions);
        renderOptions();
      });
    }
    document.addEventListener('click', e=>{ if(!e.target.closest('.select-pro')) $$('.select-pro.open').forEach(x=>x.classList.remove('open')); });

    function refreshIcons(){ if(window.lucide) lucide.createIcons(); }


    document.addEventListener('click', e=>{
      const nav = e.target.closest('.nav-item'); if(nav){ e.preventDefault(); routeTo(nav.dataset.page); }
      const link = e.target.closest('[data-page-link]'); if(link){ routeTo(link.dataset.pageLink); }
      const modalType = e.target.closest('[data-modal]'); if(modalType){ openModalByType(modalType.dataset.modal); }
      const openModalBtn = e.target.closest('[data-open-modal]'); if(openModalBtn){ openTenantModal(); }
      const viewTenant = e.target.closest('[data-view-tenant]'); if(viewTenant){ routeTo('tenant-detail'); }
      const openMods = e.target.closest('[data-open-modules]'); if(openMods){ routeTo('tenant-detail'); setTimeout(()=>activateTenantTab('modules'), 20); }
      const manage = e.target.closest('[data-manage-module]'); if(manage){ openDrawer(manage.dataset.manageModule); }
      const result = e.target.closest('[data-result-page]'); if(result){ routeTo(result.dataset.resultPage); }
      const swatch = e.target.closest('.swatch'); if(swatch){ document.documentElement.dataset.accent = swatch.dataset.color; $('#accentPopover').classList.remove('show'); drawCharts(); showToast('Accent updated', `Accent color changed to ${swatch.dataset.color}.`); }
      if(e.target.closest('[data-confirm-suspend]')){ openConfirmModal({title:'Suspend Tenant', subtitle:'Prevent public access and protect platform integrity.', message:'This will prevent the church from publishing active public modules and may limit admin access depending on billing rules.', keyword:'SUSPEND', iconName:'circle-slash', onConfirm:()=>showToast('Tenant suspended', 'Tenant suspension completed in preview mode.')}); }
      const tabOpen = e.target.closest('[data-tab-open]'); if(tabOpen){ activateTenantTab('modules'); }
    });

    function activateTenantTab(tabKey){
      const key = tabKey.replace('Tab','');
      $$('#tenantTabs .tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===key));
      $$('.tab-panel').forEach(p=>p.classList.toggle('active', p.id===`tab-${key}`));
    }

    function init(){
      renderNav(); renderAllPages(); enhanceSelects(); refreshIcons();
      $('#collapseBtn').addEventListener('click', ()=>{ $('#appShell').classList.toggle('collapsed'); const i=$('#collapseBtn i'); i.setAttribute('data-lucide', $('#appShell').classList.contains('collapsed')?'panel-left-open':'panel-left-close'); refreshIcons(); });
      $('#mobileMenu').addEventListener('click', ()=>{ $('#sidebar').classList.add('show'); $('#mobileBackdrop').classList.add('show'); });
      $('#mobileBackdrop').addEventListener('click', ()=>{ $('#sidebar').classList.remove('show'); $('#mobileBackdrop').classList.remove('show'); });
      $('#themeToggle').addEventListener('click', ()=>{ const root=document.documentElement; root.dataset.theme = root.dataset.theme==='dark'?'light':'dark'; $('#themeToggle i').setAttribute('data-lucide', root.dataset.theme==='dark'?'sun':'moon'); refreshIcons(); drawCharts(); });
      $('#accentToggle').addEventListener('click', ()=>$('#accentPopover').classList.toggle('show'));
      $('#globalSearch').addEventListener('input', renderSearch);
      $('#drawerClose').addEventListener('click', closeDrawer); $('#drawerBackdrop').addEventListener('click', closeDrawer);
      $('#drawerSave').addEventListener('click', ()=>{ closeDrawer(); showToast('Module settings saved', 'Entitlement and public availability settings were saved in the preview.'); });
      $('#drawerSuspend').addEventListener('click', ()=>openConfirmModal({title:'Suspend Module', subtitle:'Disable or suspend tenant access to this module.', message:'This can hide the module from public church websites and mobile apps while preserving dashboard preview access where allowed.', keyword:'SUSPEND', iconName:'circle-slash', onConfirm:()=>{ closeDrawer(); showToast('Module suspended', 'Module suspension pattern completed in preview mode.'); }}));
      $('#drawerAudit').addEventListener('click', ()=>{ closeDrawer(); routeTo('audit'); });
      $('#createTenantTop').addEventListener('click', openTenantModal);
      $('#modalClose').addEventListener('click', closeModal); $('#modalSecondary').addEventListener('click', closeModal); $('#modalBackdrop').addEventListener('click', closeModal);
      $('#modalPrimary').addEventListener('click', ()=>{ if(activeModalAction) activeModalAction(); });
      document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeDrawer(); closeModal(); closeSearch(); $('#accentPopover').classList.remove('show'); } });
      $('#tenantStatusFilter')?.addEventListener('change', e=>{ const v=e.target.value; const filtered = v==='All statuses' ? tenants : tenants.filter(t=>t.status===v); $('#tenantTable tbody').innerHTML=tenantRows(filtered); refreshIcons(); });
      document.addEventListener('click', e=>{ if(e.target.closest('#tenantTabs .tab-btn')){ const btn=e.target.closest('.tab-btn'); activateTenantTab(btn.dataset.tab); } });
      const hash = window.location.hash.replace('#','') || 'overview'; routeTo(hash);
      window.addEventListener('resize', drawCharts);
      setTimeout(drawCharts, 120);
    }
    init();
  </script>
</body>
</html>
