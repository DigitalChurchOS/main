<!doctype html>
<html lang="en" data-theme="light" data-accent="red">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Digital Church OS — Tenant Dashboard Preview v7</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --rail: 76px;
      --subnav: 242px;
      --radius-xs: 8px;
      --radius-sm: 12px;
      --radius-md: 16px;
      --radius-lg: 22px;
      --radius-xl: 30px;
      --ease: cubic-bezier(.2,.8,.2,1);
      --success: #16a34a;
      --success-soft: rgba(22, 163, 74, .12);
      --warning: #d97706;
      --warning-soft: rgba(217, 119, 6, .14);
      --danger: #dc2626;
      --danger-soft: rgba(220, 38, 38, .12);
      --info: #2563eb;
      --info-soft: rgba(37, 99, 235, .12);
      --purple: #7c3aed;
      --purple-soft: rgba(124, 58, 237, .12);
      --pink: #db2777;
      --pink-soft: rgba(219, 39, 119, .12);
      --shadow-soft: 0 22px 70px rgba(15, 23, 42, .08);
      --shadow-card: 0 14px 40px rgba(15, 23, 42, .065);
      --z-dropdown: 100;
      --z-modal: 500;
    }

    html[data-theme="light"] {
      --bg: #f7f8fa;
      --bg-soft: #fbfaf8;
      --surface: rgba(255,255,255,.82);
      --surface-strong: #ffffff;
      --surface-2: #f1f3f6;
      --rail-bg: #f0f2f5;
      --subnav-bg: rgba(255,255,255,.88);
      --line: rgba(15, 23, 42, .10);
      --line-strong: rgba(15, 23, 42, .16);
      --text: #151923;
      --muted: #68707d;
      --muted-2: #98a2b3;
      --glass: rgba(255,255,255,.72);
      --backdrop: rgba(15,23,42,.45);
      color-scheme: light;
    }

    html[data-theme="dark"] {
      --bg: #111723;
      --bg-soft: #151d2b;
      --surface: rgba(24, 33, 48, .84);
      --surface-strong: #182130;
      --surface-2: #202a3a;
      --rail-bg: #0d111b;
      --subnav-bg: rgba(20, 28, 42, .92);
      --line: rgba(226, 232, 240, .095);
      --line-strong: rgba(226, 232, 240, .16);
      --text: #f5f7fb;
      --muted: #a7b0c2;
      --muted-2: #707c91;
      --glass: rgba(24,33,48,.76);
      --backdrop: rgba(0,0,0,.58);
      --shadow-soft: 0 22px 70px rgba(0,0,0,.24);
      --shadow-card: 0 14px 40px rgba(0,0,0,.18);
      color-scheme: dark;
    }

    html[data-accent="orange"] { --accent: #f97316; --accent-2: #fb923c; --accent-soft: rgba(249, 115, 22, .14); --accent-shadow: rgba(249, 115, 22, .28); }
    html[data-accent="blue"] { --accent: #2563eb; --accent-2: #60a5fa; --accent-soft: rgba(37, 99, 235, .14); --accent-shadow: rgba(37, 99, 235, .28); }
    html[data-accent="purple"] { --accent: #7c3aed; --accent-2: #a78bfa; --accent-soft: rgba(124, 58, 237, .14); --accent-shadow: rgba(124, 58, 237, .28); }
    html[data-accent="green"] { --accent: #16a34a; --accent-2: #4ade80; --accent-soft: rgba(22, 163, 74, .14); --accent-shadow: rgba(22, 163, 74, .28); }
    html[data-accent="red"] { --accent: #c80d3d; --accent-2: #f0628a; --accent-soft: rgba(200, 13, 61, .14); --accent-shadow: rgba(200, 13, 61, .26); }
    html[data-accent="pink"] { --accent: #db2777; --accent-2: #f472b6; --accent-soft: rgba(219, 39, 119, .14); --accent-shadow: rgba(219, 39, 119, .28); }
    html[data-accent="gray"] { --accent: #475569; --accent-2: #94a3b8; --accent-soft: rgba(71, 85, 105, .14); --accent-shadow: rgba(71, 85, 105, .28); }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(circle at top left, var(--accent-soft), transparent 34rem),
        radial-gradient(circle at 82% 12%, rgba(14,165,233,.11), transparent 26rem),
        var(--bg);
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    svg { flex: 0 0 auto; }
    .hidden { display: none !important; }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: calc(var(--rail) + var(--subnav)) minmax(0, 1fr);
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      display: grid;
      grid-template-columns: var(--rail) var(--subnav);
      border-right: 1px solid var(--line);
      z-index: 40;
    }

    .rail {
      background: var(--rail-bg);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 16px 0;
      overflow: auto;
      scrollbar-width: none;
    }
    .rail::-webkit-scrollbar { display: none; }
    .rail-logo {
      width: 46px;
      height: 46px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      color: white;
      background: linear-gradient(145deg, var(--accent), var(--accent-2));
      box-shadow: 0 18px 34px var(--accent-shadow);
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }
    .rail-logo:after { display: none; content: none; }
    .rail-logo svg { width: 23px; height: 23px; z-index: 1; }
    .rail-main { width: 100%; display: grid; gap: 7px; }
    .rail-footer { margin-top: auto; width: 100%; display: grid; gap: 7px; padding-top: 14px; border-top: 1px solid var(--line); }
    .rail-btn {
      width: 60px;
      min-height: 58px;
      border: 1px solid transparent;
      border-radius: 14px;
      background: transparent;
      color: var(--muted);
      display: grid;
      place-items: center;
      gap: 3px;
      margin: 0 auto;
      padding: 7px 4px;
      position: relative;
      transition: background .16s ease, color .16s ease, transform .16s ease, border .16s ease;
    }
    .rail-btn:hover { transform: translateY(-1px); color: var(--text); background: var(--surface-2); }
    .rail-btn.active { color: var(--accent); background: var(--surface-strong); border-color: var(--line); box-shadow: 0 10px 24px rgba(15,23,42,.06); }
    html[data-theme="dark"] .rail-btn.active { color: #fff; background: var(--surface-2); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
    .rail-btn.active:before { content: ""; position: absolute; left: -1px; top: 15%; width: 3px; height: 70%; border-radius: 0 999px 999px 0; background: var(--accent); }
    .rail-btn svg { width: 21px; height: 21px; stroke-width: 1.8; }
    .rail-btn span { font-size: 9px; font-weight: 700; line-height: 1; }

    .subnav {
      background: var(--subnav-bg);
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }
    .subnav-head {
      padding: 20px 16px 16px;
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 14px;
    }
    .context-card {
      border: 1px solid var(--line);
      background: var(--surface-2);
      border-radius: 12px;
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      transition: border .16s ease, background .16s ease;
    }
    .context-card:hover { border-color: color-mix(in srgb, var(--accent) 32%, var(--line)); }
    .context-card small { display: block; font-size: 9px; text-transform: uppercase; letter-spacing: .08em; font-weight: 900; color: var(--muted); }
    .context-card strong { display: block; font-size: 13px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 165px; }
    .context-card svg { width: 15px; height: 15px; color: var(--muted); }
    .search-box { position: relative; }
    .search-box svg { position: absolute; width: 16px; height: 16px; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted-2); }
    .search-box input {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface-strong);
      color: var(--text);
      padding: 0 12px 0 38px;
      outline: none;
      font-size: 13px;
    }
    .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .subnav-content { padding: 16px 8px; overflow: auto; scrollbar-width: none; }
    .subnav-content::-webkit-scrollbar { display: none; }
    .subnav-title { padding: 0 8px 12px; font-size: 10px; color: var(--muted); text-transform: uppercase; font-weight: 900; letter-spacing: .08em; }
    .subnav-list { display: grid; gap: 4px; }
    .subnav-item {
      width: 100%;
      min-height: 40px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 12px;
      text-align: left;
      transition: background .16s ease, color .16s ease, border .16s ease;
    }
    .subnav-item:hover { color: var(--text); background: var(--surface-2); }
    .subnav-item.active { color: var(--text); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 24%, transparent); }
    .subnav-item svg { width: 18px; height: 18px; stroke-width: 1.75; }
    .subnav-item span { font-size: 13px; font-weight: 650; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .subnav-item .chev { width: 13px; height: 13px; opacity: .65; }

    .workspace { min-width: 0; display: flex; flex-direction: column; }
    .topbar {
      height: 74px;
      position: sticky;
      top: 0;
      z-index: 28;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 0 28px;
      border-bottom: 1px solid var(--line);
      background: var(--glass);
      backdrop-filter: blur(22px);
    }
    .topbar-left { min-width: 0; display: flex; align-items: center; gap: 12px; }
    .hamburger { display: none !important; }
    .title-group { min-width: 0; }
    .title-group h1 {
      margin: 0;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      font-size: 21px;
      line-height: 1.1;
      letter-spacing: -.035em;
      white-space: nowrap;
    }
    .title-group h1 svg {
      width: 21px;
      height: 21px;
      stroke-width: 1.9;
      color: var(--accent);
      flex: 0 0 auto;
    }
    .title-group h1 span { overflow: hidden; text-overflow: ellipsis; }
    .topbar-actions { display: flex; align-items: center; gap: 10px; }
    .top-search { position: relative; width: min(430px, 30vw); }
    .top-search svg { position: absolute; width: 16px; height: 16px; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted-2); }
    .top-search input {
      width: 100%;
      height: 40px;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 999px;
      padding: 0 14px 0 39px;
      outline: none;
      color: var(--text);
      font-size: 13px;
    }
    .top-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .search-panel {
      position: absolute;
      display: none;
      top: calc(100% + 10px);
      left: 0;
      right: 0;
      background: var(--surface-strong);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      z-index: var(--z-dropdown);
    }
    .search-panel.show { display: block; }
    .search-panel h4 { margin: 0; padding: 12px 14px 6px; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
    .search-result { display: flex; align-items: center; gap: 10px; padding: 10px 14px; color: var(--muted); border-top: 1px solid var(--line); }
    .search-result:hover { background: var(--accent-soft); color: var(--text); }
    .search-result svg { position: static; transform: none; color: var(--accent); }
    .search-result strong { color: var(--text); font-size: 13px; }
    .search-result small { display: block; color: var(--muted); margin-top: 2px; }

    .btn {
      min-height: 40px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
      transition: transform .12s ease, box-shadow .12s ease, border .12s ease, background .12s ease;
    }
    .btn:hover { transform: translateY(-1px); border-color: color-mix(in srgb, var(--accent) 30%, var(--line)); }
    .btn.primary { border-color: transparent; color: #fff; background: linear-gradient(145deg, var(--accent), var(--accent-2)); box-shadow: 0 14px 30px var(--accent-shadow); }
    .btn.ghost { background: transparent; }
    .btn.danger { color: var(--danger); background: var(--danger-soft); border-color: rgba(220,38,38,.2); }
    .btn.small { min-height: 32px; border-radius: 10px; padding: 0 10px; font-size: 12px; }
    .btn.icon { width: 40px; padding: 0; border-radius: 14px; color: var(--muted); }
    .btn svg { width: 16px; height: 16px; stroke-width: 1.8; }
    .avatar { width: 32px; height: 32px; border-radius: 999px; display: grid; place-items: center; background: var(--accent); color: #fff; font-weight: 900; font-size: 12px; }
    .profile-btn { background: var(--accent-soft); border-radius: 999px; padding: 4px 7px 4px 4px; }
    .profile-menu, .accent-menu {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      background: var(--surface-strong);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow-soft);
      z-index: var(--z-dropdown);
      display: none;
      overflow: hidden;
    }
    .profile-menu.show, .accent-menu.show { display: block; }
    .profile-menu { min-width: 210px; padding: 6px; }
    .menu-link { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 11px; color: var(--muted); font-size: 13px; font-weight: 700; }
    .menu-link:hover { color: var(--text); background: var(--accent-soft); }
    .menu-link svg { width: 16px; height: 16px; }
    .accent-menu { padding: 10px; grid-template-columns: repeat(7, 28px); gap: 8px; }
    .accent-menu.show { display: grid; }
    .swatch { width: 28px; height: 28px; border-radius: 999px; border: 3px solid var(--surface-strong); box-shadow: 0 0 0 1px var(--line); }
    .swatch[data-color="orange"] { background: #f97316; }
    .swatch[data-color="blue"] { background: #2563eb; }
    .swatch[data-color="purple"] { background: #7c3aed; }
    .swatch[data-color="green"] { background: #16a34a; }
    .swatch[data-color="red"] { background: #c80d3d; }
    .swatch[data-color="pink"] { background: #db2777; }
    .swatch[data-color="gray"] { background: #475569; }

    .content {
      width: min(1510px, 100%);
      margin: 0 auto;
      padding: 26px;
    }
    .grid { display: grid; gap: 16px; }
    .card, .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      min-width: 0;
    }
    .card { padding: 18px; }
    .panel { padding: 20px; }
    .section-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 16px; }
    .section-head h2, .section-head h3 { margin: 0; font-size: 18px; letter-spacing: -.025em; }
    .section-head p { margin: 5px 0 0; color: var(--muted); line-height: 1.5; font-size: 13px; }
    .eyebrow { display: inline-flex; align-items: center; gap: 8px; color: var(--accent); font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: .12em; }
    .eyebrow svg { width: 15px; height: 15px; }
    .hero {
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      gap: 18px;
      align-items: center;
      padding: 24px;
      background:
        linear-gradient(135deg, var(--surface-strong), var(--surface)),
        radial-gradient(circle at 90% 22%, var(--accent-soft), transparent 18rem);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      position: relative;
    }
    .hero:after { content: ""; position: absolute; right: -100px; top: -110px; width: 280px; height: 280px; border-radius: 999px; border: 44px solid var(--accent-soft); pointer-events: none; }
    .hero h2 { margin: 9px 0 8px; font-size: clamp(30px, 4vw, 48px); line-height: 1.02; letter-spacing: -.06em; }
    .hero p { margin: 0; color: var(--muted); line-height: 1.65; max-width: 820px; }
    .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; z-index: 1; }

    .welcome-home-top {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr);
      gap: clamp(32px, 8vw, 140px);
      align-items: end;
      min-height: clamp(340px, 48vh, 560px);
      padding: clamp(38px, 8vh, 96px) 0 clamp(42px, 8vh, 90px);
      margin: -26px -26px 8px;
      overflow: hidden;
      isolation: isolate;
    }
    .welcome-bg-wrapper {
      position: absolute;
      inset: 0 0 auto 0;
      width: 100%;
      min-height: 100%;
      pointer-events: none;
      user-select: none;
      z-index: 0;
      will-change: transform;
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) calc(100% - 180px), rgba(0,0,0,0) 100%);
      mask-image: linear-gradient(to bottom, rgba(0,0,0,1) calc(100% - 180px), rgba(0,0,0,0) 100%);
    }
    .welcome-bg-image {
      width: 100%;
      min-height: clamp(380px, 58vh, 650px);
      object-fit: cover;
      object-position: top center;
      display: block;
      pointer-events: none;
      user-select: none;
      opacity: .92;
      filter: saturate(1.03) contrast(1.02);
    }
    html[data-theme="light"] .welcome-bg-dark { display: none !important; }
    html[data-theme="dark"] .welcome-bg-light { display: none !important; }
    .welcome-bg-overlay-tint {
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(90deg, var(--bg) 0%, color-mix(in srgb, var(--bg) 86%, transparent) 28%, color-mix(in srgb, var(--bg) 52%, transparent) 58%, color-mix(in srgb, var(--bg) 18%, transparent) 100%),
        linear-gradient(180deg, color-mix(in srgb, var(--bg) 10%, transparent) 0%, var(--bg) 100%);
    }
    html[data-theme="light"] .welcome-bg-overlay-tint {
      background:
        linear-gradient(90deg, var(--bg) 0%, color-mix(in srgb, var(--bg) 86%, transparent) 30%, color-mix(in srgb, var(--bg) 45%, transparent) 62%, color-mix(in srgb, #ffffff 10%, transparent) 100%),
        linear-gradient(180deg, rgba(255,255,255,.12) 0%, var(--bg) 100%);
    }
    html[data-theme="dark"] .welcome-bg-overlay-tint {
      background:
        linear-gradient(90deg, var(--bg) 0%, color-mix(in srgb, var(--bg) 82%, transparent) 30%, color-mix(in srgb, var(--bg) 48%, transparent) 62%, color-mix(in srgb, var(--bg) 16%, transparent) 100%),
        linear-gradient(180deg, rgba(17,23,35,.10) 0%, var(--bg) 100%);
    }
    .welcome-home-copy, .welcome-home-actions {
      position: relative;
      z-index: 2;
    }
    .welcome-home-copy {
      padding-left: 26px;
      max-width: 860px;
    }
    .welcome-home-copy h2 {
      margin: 9px 0 12px;
      font-size: clamp(36px, 5vw, 68px);
      line-height: .96;
      letter-spacing: -.07em;
      max-width: 780px;
    }
    .welcome-home-copy p {
      margin: 0;
      color: var(--muted);
      line-height: 1.68;
      font-size: clamp(15px, 1.25vw, 18px);
      max-width: 680px;
    }
    .welcome-home-actions {
      display: flex;
      justify-content: flex-end;
      align-items: flex-end;
      gap: 10px;
      flex-wrap: wrap;
      padding: 0 26px 8px 0;
      min-height: 120px;
    }

    .module-page { position: relative; min-height: calc(100vh - 126px); isolation: isolate; }
    .module-page > *:not(.module-visual) { position: relative; z-index: 2; }
    .module-visual {
      position: absolute;
      top: -34px;
      right: -42px;
      width: min(58%, 880px);
      height: 360px;
      opacity: .155;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      padding: 30px 0 0 0;
      -webkit-mask-image: linear-gradient(to right, transparent 0%, rgba(0,0,0,.02) 8%, rgba(0,0,0,.16) 25%, #000 56%, #000 100%);
      mask-image: linear-gradient(to right, transparent 0%, rgba(0,0,0,.02) 8%, rgba(0,0,0,.16) 25%, #000 56%, #000 100%);
    }
    .module-visual::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 82% 22%, var(--accent-soft), transparent 22rem),
        linear-gradient(90deg, transparent 0%, color-mix(in srgb, var(--accent) 6%, transparent) 42%, color-mix(in srgb, var(--surface-strong) 44%, transparent) 100%);
    }
    .module-visual svg {
      position: relative;
      z-index: 1;
      width: clamp(230px, 24vw, 420px);
      height: clamp(230px, 24vw, 420px);
      margin-right: -12px;
      color: var(--accent);
      stroke-width: 1.15;
      transform: rotate(-8deg);

    /* Requested interaction refinements */
    #content.page-transition > section,
    #content.page-transition .module-page > *:not(.module-visual) {
      opacity: 0;
      transform: translateY(-18px) scale(.992);
      filter: blur(3px);
      animation: pageInsetFade .72s var(--ease) forwards;
    }
    #content.page-transition > section:nth-child(2),
    #content.page-transition .module-page > *:not(.module-visual):nth-child(3) { animation-delay: .08s; }
    #content.page-transition > section:nth-child(3),
    #content.page-transition .module-page > *:not(.module-visual):nth-child(4) { animation-delay: .15s; }
    #content.page-transition > section:nth-child(4),
    #content.page-transition .module-page > *:not(.module-visual):nth-child(5) { animation-delay: .22s; }
    @keyframes pageInsetFade {
      from { opacity: 0; transform: translateY(-18px) scale(.992); filter: blur(3px); }
      to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    .drawer-overlay {
      display: block !important;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .34s ease, visibility .34s ease;
    }
    .drawer-overlay.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    .drawer {
      transform: translateX(104%);
      opacity: .78;
      transition: transform .48s cubic-bezier(.2,.84,.22,1), opacity .42s ease;
      will-change: transform, opacity;
    }
    .drawer-overlay.show .drawer { transform: translateX(0); opacity: 1; }

    function getBlueprint(item) {
      const source = moduleBlueprints[item?.key] || {};
      const fallback = {
        desc: item?.desc || 'Manage records, settings, workflows, and reports for this module.',
        tabs: ['Overview','Records','Settings','Reports'],
        actionLabel: 'Create Record',
        metrics: [['Records','1,284','database','Updated today','good'],['Public Status','Preview','eye','Requires live access','warn'],['Team Users','12','users-round','3 active now','good'],['Automation','8','zap','4 running','info']],
        records: [['Primary workspace','Module record','Active','Ready for staff','Open'],['Public page block','Website component','Preview','Needs public access','Edit'],['Member workflow','Automation','Draft','Review settings','Manage'],['Reporting view','Analytics','Active','Updated today','View']],
        features: [['Records management','Create, edit, filter, and manage tenant-scoped records.', item?.icon || 'blocks'],['Settings area','Configure module behavior from the central dashboard.','sliders-horizontal'],['Permissions','Respect role-based access and audit every sensitive action.','shield-check'],['Reports','Show analytics, exports, and operational health.','chart-line']],
        workflow: [['Open module','Review current records, status, and readiness.'],['Configure settings','Set visibility, permissions, integrations, and limits.'],['Create first record','Add a real item so staff can test the workflow.'],['Preview then publish','Keep dashboard preview available while public access follows entitlement.']],
        settings: [['Enable dashboard preview','Staff can configure this module before public activation.', true],['Allow public publishing','Public website and app access requires enabled entitlement.', false],['Send activity to audit logs','Track updates, permissions, and sensitive actions.', true],['Use tenant branding','Apply site theme, accent, and localization.', true]],
        integrations: ['Members CRM','Notifications','Settings','Audit Logs']
      };
      return { ...fallback, ...source };
    }
    function moduleHeader(item, opts = {}) {
      const bp = getBlueprint(item);
      const desc = shortDescription(opts.desc || bp.desc || item.desc, 15);
      const configureText = opts.configureText || 'Tutorial';
      const previewText = opts.previewText || 'Preview';
      const configureAction = opts.configureAction || `openTutorialDrawer('${escapeJs(item.name)}','${escapeJs(desc)}')`;
      const previewAction = opts.previewAction || `showToast('${escapeJs(item.name)} preview opened.')`;
      return `<section class="module-top">
        <div class="module-top-copy">
          <h2>${item.name}</h2>
          <p>${desc}</p>
        </div>
        <div class="module-top-actions">
          <button class="btn primary" onclick="${configureAction}"><i data-lucide="play-circle"></i>${configureText}</button>
          <button class="btn" onclick="${previewAction}"><i data-lucide="eye"></i>${previewText}</button>
        </div>
      </section>`;
    }

    function modulePageShell(item, body, opts = {}) {
      return `<div class="module-page"><div class="module-visual" aria-hidden="true"><i data-lucide="${item.icon}"></i></div>${moduleHeader(item, opts)}${body}</div>`;
    }

    function init() {
      renderRail();
      renderSubnav();
      renderPage();
      document.addEventListener('click', (event) => {
        if (!event.target.closest('.profile-btn') && !event.target.closest('#profileMenu')) document.getElementById('profileMenu').classList.remove('show');
        if (!event.target.closest('#accentMenu') && !event.target.closest('[title="Accent colors"]')) document.getElementById('accentMenu').classList.remove('show');
        const globalResults = document.getElementById('globalResults');
        if (globalResults && !event.target.closest('.top-search')) globalResults.classList.remove('show');
      });
      lucide.createIcons();
    }

    function renderRail() {
      const main = document.getElementById('railMain');
      const footer = document.getElementById('railFooter');
      main.innerHTML = categories.filter(c => !c.footer).map(c => railButton(c)).join('');
      footer.innerHTML = categories.filter(c => c.footer).map(c => railButton(c)).join('');
    }
    function railButton(c) {
      return `<button class="rail-btn ${state.category === c.key ? 'active' : ''}" onclick="selectCategory('${c.key}')" title="${c.label}"><i data-lucide="${c.icon}"></i><span>${c.label}</span></button>`;
    }
    function selectCategory(categoryKey) {
      const c = findCategory(categoryKey);
      state.category = c.key;
      state.page = c.items[0].key;
      document.getElementById('sidebarSearch').value = '';
      renderRail(); renderSubnav(); renderPage(); toggleMobileSidebar(false); lucide.createIcons();
    }
    function navigate(categoryKey, pageKey) {
      state.category = categoryKey;
      state.page = pageKey;
      renderRail(); renderSubnav(); renderPage(); toggleMobileSidebar(false); lucide.createIcons();
    }
    function renderSubnav() {
      const c = findCategory(state.category);
      const q = (document.getElementById('sidebarSearch')?.value || '').trim().toLowerCase();
      const items = q ? allItems().filter(item => `${item.name} ${item.desc} ${item.categoryLabel}`.toLowerCase().includes(q)) : c.items;
      document.getElementById('subnavTitle').textContent = q ? 'Search Results' : c.title;
      document.getElementById('subnavList').innerHTML = items.map(item => `
        <button class="subnav-item ${state.page === item.key ? 'active' : ''}" onclick="navigate('${item.category || c.key}','${item.key}')">
          <i data-lucide="${item.icon}"></i><span>${item.name}</span><i class="chev" data-lucide="chevron-right"></i>
        </button>`).join('') || `<div class="list-item"><div class="list-icon"><i data-lucide="search-x"></i></div><div><strong>No results</strong><span>Try searching for prayer, giving, media, site, or settings.</span></div></div>`;
      lucide.createIcons();
    }
    function renderPage() {
      const item = findItem(state.page);
      const category = findCategory(state.category);
      document.getElementById('pageTitle').innerHTML = `<i data-lucide="${category.icon}"></i><span>${category.label}</span>`;
      const content = document.getElementById('content');
      let html = '';
      if (state.page === 'overview') html = homePage();
      else if (state.page === 'launch') html = launchPage();
      else if (state.page === 'activity') html = activityPage();
      else if (state.page === 'churchDetails') html = churchDetailsPage();
      else if (state.page === 'churchfront') html = churchfrontPage();
      else if (state.page === 'themes') html = themesPage();
      else if (state.page === 'styling') html = stylingPage();
      else if (state.page === 'plugins') html = pluginsPage();
      else if (state.page === 'language') html = languagePage();
      else if (state.page === 'marketplace') html = marketplacePage();
      else if (state.page === 'prayer') html = prayerPage();
      else if (state.page === 'givingHome') html = givingPage();
      else if (state.page === 'store') html = storePage();
      else if (state.page === 'usersRoles') html = usersRolesPage();
      else if (state.page === 'billing') html = billingPage();
      else if (state.page === 'analytics') html = analyticsPage();
      else if (state.page === 'preferences') html = settingsPage();
      else if (state.page === 'integrations') html = integrationsPage();
      else if (state.page === 'security') html = securityPage();
      else if (state.page === 'profile') html = profilePage();
      else html = genericModulePage(item);
      const isModulePage = !['overview','launch','activity'].includes(state.page);
      content.classList.remove('page-transition');
      window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
      content.scrollTop = 0;
      content.innerHTML = isModulePage ? modulePageShell(item, html) : html;
      requestAnimationFrame(() => content.classList.add('page-transition'));
      afterRender();
    }

    function afterRender() {
      lucide.createIcons();
      setTimeout(() => {
        document.querySelectorAll('[data-chart="line"]').forEach(drawLineChart);
        document.querySelectorAll('[data-chart="bars"]').forEach(drawBarsChart);
        document.querySelectorAll('[data-chart="donut"]').forEach(drawDonutChart);
      }, 40);
      bindModuleParallax();
      bindWelcomeParallax();
    }

    function bindWelcomeParallax() {
      const updateWelcomeParallax = () => {
        const bgWrapper = document.getElementById('welcome-bg-wrapper');
        if (!bgWrapper) return;
        const y = Math.max(-180, Math.min(0, -window.scrollY * .28));
        bgWrapper.style.transform = `translate3d(0, ${y.toFixed(2)}px, 0)`;
      };
      updateWelcomeParallax();
      if (window.__tenantWelcomeParallaxBound) return;
      window.__tenantWelcomeParallaxBound = true;
      window.addEventListener('scroll', updateWelcomeParallax, { passive: true });
    }

    function bindModuleParallax() {
      const updateScrollParallax = () => {
        const page = document.querySelector('.module-page');
        if (!page) return;
        const s = Math.max(-18, Math.min(42, window.scrollY * .055));
        page.style.setProperty('--scroll-parallax', `${s.toFixed(2)}px`);
      };
      updateScrollParallax();
      if (window.__tenantModuleParallaxBound) return;
      window.__tenantModuleParallaxBound = true;
      window.addEventListener('scroll', updateScrollParallax, { passive: true });
    }

      return `<div class="table-card card"><table><thead><tr><th>Record</th><th>Status</th><th>Owner / Signal</th><th>Next Step</th><th>Action</th></tr></thead><tbody>${(bp.records || []).map((r,i)=>`<tr><td><div class="record-name"><span class="record-dot"></span><div><strong>${r[0]}</strong><span>${r[1]}</span></div></div></td><td><span class="badge ${i===0?'success':i===1?'info':i===2?'warning':'purple'}">${r[2]}</span></td><td>${r[3]}</td><td>${r[4] || 'Review'}</td><td><button class="btn small" onclick="showToast('${escapeJs(r[0])} opened.')">Open</button></td></tr>`).join('')}</tbody></table></div>`;
    }
    function moduleSettingsList(bp) { return `<div class="settings-stack">${(bp.settings || []).map(s => setting(s[0], s[1], !!s[2])).join('')}</div>`; }
    function moduleIntegrationCloud(bp) { return `<div class="integration-cloud">${(bp.integrations || []).map(x => `<span class="integration-chip"><i data-lucide="plug"></i>${x}</span>`).join('')}</div>`; }
    function genericModulePage(item) {
      const bp = getBlueprint(item);
      const metrics = (bp.metrics || []).map(m => kpi(m[0], m[1], m[2] || item.icon, m[3] || 'Updated today', m[4] || 'good')).join('');
      return `<section class="grid kpi-grid">${metrics}</section>
        <section class="grid module-workspace-grid">
          <div class="panel module-blueprint-panel">
            <div class="section-head"><div><h2>${item.name} Workspace</h2><p>${bp.fullDesc || bp.desc}</p></div><button class="btn small primary" onclick="showToast('${escapeJs(bp.actionLabel || 'Create')} opened.')"><i data-lucide="plus"></i>${bp.actionLabel || 'Create'}</button></div>
            <div class="tabs" style="margin-bottom:16px">${(bp.tabs || []).map((t,i)=>`<button class="tab-btn ${i===0?'active':''}" onclick="showToast('${escapeJs(t)} tab selected.')">${t}</button>`).join('')}</div>
            ${moduleRecordsTable(bp)}
          </div>
        </section>
        <section class="grid module-lower-grid">
          <div class="panel">
            <div class="section-head"><div><h2>Setup & Operation Flow</h2><p>How church staff should configure and run this module.</p></div></div>
            <div class="workflow-steps">${(bp.workflow || []).map(moduleWorkflowStep).join('')}</div>
          </div>
          <div class="panel">
            <div class="section-head"><div><h2>Settings, Rules & Integrations</h2><p>Tenant settings, public visibility gates, and connected services.</p></div><button class="btn small" onclick="openTutorialDrawer('${escapeJs(item.name)}','${escapeJs(bp.desc)}')"><i data-lucide="play-circle"></i>Tutorial</button></div>
            ${moduleSettingsList(bp)}
            <div style="border-top:1px solid var(--line);margin-top:16px;padding-top:16px"><h3 style="margin:0 0 10px;font-size:15px">Connected Surfaces</h3>${moduleIntegrationCloud(bp)}</div>
            ${bp.apis && bp.apis.length ? `<div style="border-top:1px solid var(--line);margin-top:16px;padding-top:16px"><h3 style="margin:0 0 10px;font-size:15px">API Surfaces</h3><div class="integration-cloud">${bp.apis.map(api => `<span class="integration-chip"><i data-lucide="braces"></i>${api}</span>`).join('')}</div></div>` : ''}
          </div>
        </section>`;
    }

    function givingPage() { return genericModulePage(findItem('givingHome')); }
    function storePage() { return genericModulePage(findItem('store')); }
    function usersRolesPage() { return genericModulePage(findItem('usersRoles')); }
    function billingPage() { return genericModulePage(findItem('billing')); }
    function analyticsPage() { return genericModulePage(findItem('analytics')); }
    function settingsPage() { return genericModulePage(findItem('preferences')); }
    function integrationsPage() { return genericModulePage(findItem('integrations')); }
    function securityPage() { return genericModulePage(findItem('security')); }
    function profilePage() { return `<section class="grid two-col"><div class="panel" style="text-align:center"><div class="avatar" style="width:92px;height:92px;font-size:28px;margin:8px auto 16px">AD</div><h2 style="margin:0">Admin User</h2><p style="color:var(--muted);margin:8px 0 0">Tenant Owner · Lagos Central Campus</p><div class="pill-row" style="justify-content:center;margin-top:16px"><span class="badge success">2FA enabled</span><span class="badge info">Owner</span></div></div><div class="panel"><div class="section-head"><div><h2>Profile Settings</h2><p>Account, communication, and security preferences.</p></div></div><div class="form-grid"><div><label>Name</label><input value="Admin User"></div><div><label>Email</label><input value="admin@lagoscentral.church"></div><div><label>Role</label><input value="Tenant Owner"></div><div><label>Timezone</label><select><option>Africa/Lagos</option><option>UTC</option></select></div></div><div style="display:flex;justify-content:flex-end;margin-top:18px"><button class="btn primary">Save Profile</button></div></div></section>`; }

    function setting(title, desc, on) { return `<div class="setting-row"><div><strong>${title}</strong><span>${desc}</span></div><span class="toggle ${on?'on':''}" onclick="this.classList.toggle('on')"></span></div>`; }

    function drawLineChart(canvas) {
      const ctx = canvas.getContext('2d');
      const w = canvas.width = canvas.offsetWidth * devicePixelRatio;
      const h = canvas.height = canvas.offsetHeight * devicePixelRatio;
      ctx.scale(devicePixelRatio, devicePixelRatio);
      const width = canvas.offsetWidth, height = canvas.offsetHeight;
      const values = [32, 44, 38, 58, 64, 72, 68, 84, 90, 98, 106, 118];
      ctx.clearRect(0,0,width,height);
      ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--line-strong'); ctx.lineWidth = 1;
      for (let i=0;i<5;i++){ const y=30+i*(height-55)/4; ctx.beginPath(); ctx.moveTo(12,y); ctx.lineTo(width-16,y); ctx.stroke(); }
      const max = Math.max(...values), min = Math.min(...values); const xStep=(width-44)/(values.length-1);
      const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
      const grad = ctx.createLinearGradient(0,20,0,height); grad.addColorStop(0, accent + '66'); grad.addColorStop(1, accent + '00');
      ctx.beginPath();
      values.forEach((v,i)=>{ const x=22+i*xStep; const y=height-28-((v-min)/(max-min))*(height-62); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
      ctx.lineTo(width-22,height-28); ctx.lineTo(22,height-28); ctx.closePath(); ctx.fillStyle=grad; ctx.fill();
      ctx.beginPath();
      values.forEach((v,i)=>{ const x=22+i*xStep; const y=height-28-((v-min)/(max-min))*(height-62); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
      ctx.strokeStyle=accent; ctx.lineWidth=3; ctx.lineCap='round'; ctx.stroke();
      values.forEach((v,i)=>{ if (i%2===0 || i===values.length-1){ const x=22+i*xStep; const y=height-28-((v-min)/(max-min))*(height-62); ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2); ctx.fillStyle=accent; ctx.fill(); } });
    }
    function drawBarsChart(canvas) {
      const ctx = canvas.getContext('2d'); const w=canvas.width=canvas.offsetWidth*devicePixelRatio; const h=canvas.height=canvas.offsetHeight*devicePixelRatio; ctx.scale(devicePixelRatio,devicePixelRatio);
      const width=canvas.offsetWidth, height=canvas.offsetHeight; const accent=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim(); const vals=[78,64,92,53,71,85]; ctx.clearRect(0,0,width,height);
      const barW=(width-70)/vals.length; vals.forEach((v,i)=>{ const x=30+i*barW; const barH=(v/100)*(height-46); const y=height-24-barH; ctx.fillStyle='rgba(148,163,184,.16)'; ctx.fillRect(x,24,barW-14,height-48); ctx.fillStyle=i===2?accent:'rgba(148,163,184,.55)'; roundRect(ctx,x,y,barW-14,barH,8); ctx.fill(); });
    }
    function drawDonutChart(canvas) {
      const ctx=canvas.getContext('2d'); canvas.width=canvas.offsetWidth*devicePixelRatio; canvas.height=canvas.offsetHeight*devicePixelRatio; ctx.scale(devicePixelRatio,devicePixelRatio); const width=canvas.offsetWidth, height=canvas.offsetHeight; const cx=width/2, cy=height/2, r=Math.min(width,height)/2-20; const accent=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim(); const colors=[accent,'#38bdf8','#a78bfa','#22c55e','#f59e0b']; const vals=[32,22,18,16,12]; let a=-Math.PI/2; ctx.clearRect(0,0,width,height); vals.forEach((v,i)=>{ const seg=Math.PI*2*(v/100); ctx.beginPath(); ctx.arc(cx,cy,r,a,a+seg); ctx.arc(cx,cy,r-30,a+seg,a,true); ctx.closePath(); ctx.fillStyle=colors[i]; ctx.fill(); a+=seg; }); ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--surface-strong'); ctx.beginPath(); ctx.arc(cx,cy,r-42,0,Math.PI*2); ctx.fill(); ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--text'); ctx.font='800 24px Inter'; ctx.textAlign='center'; ctx.fillText('100%',cx,cy+4); ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--muted'); ctx.font='700 11px Inter'; ctx.fillText('Engagement',cx,cy+24); }
    function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

    function setAccent(color) { document.documentElement.dataset.accent = color; localStorage.setItem('tenantAccent', color); document.getElementById('accentMenu').classList.remove('show'); afterRender(); }
    function toggleTheme() { document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; afterRender(); }
    function toggleAccentMenu() { document.getElementById('accentMenu').classList.toggle('show'); }
    function toggleProfileMenu() { document.getElementById('profileMenu').classList.toggle('show'); }
    function toggleMobileSidebar(show) { document.body.classList.toggle('sidebar-open', show); }
    function renderGlobalSearch() {
      const box = document.getElementById('globalSearch'); const panel = document.getElementById('globalResults'); if (!box || !panel) return; const q = box.value.toLowerCase();
      const matches = allItems().filter(i => `${i.name} ${i.desc}`.toLowerCase().includes(q)).slice(0,7);
      panel.innerHTML = `<h4>Search Results</h4>${(matches.length?matches:allItems().slice(0,5)).map(i=>`<button class="search-result" onclick="navigate('${i.category}','${i.key}')"><i data-lucide="${i.icon}"></i><span><strong>${i.name}</strong><small>${i.desc}</small></span></button>`).join('')}`;
      panel.classList.add('show'); lucide.createIcons();
    }
    function closeTutorialDrawer(){ document.getElementById('drawerOverlay').classList.remove('show'); }
    function openTutorialDrawer(title, desc) {
      const matchedItem = allItems().find(i => i.name === title) || allItems().find(i => String(title).toLowerCase().includes(i.name.toLowerCase()));
      const bp = matchedItem ? getBlueprint(matchedItem) : { desc, workflow: [['Review purpose','Confirm how this module supports the church workflow.'], ['Complete settings','Set visibility, permissions, providers, and required fields.'], ['Create a test record','Add one real record and verify the staff workflow.'], ['Preview before publishing','Keep public access gated until entitlement and review are complete.']], features: [] };
      const safeTitle = escapeHtml(title);
      const safeDesc = escapeHtml(shortDescription(bp.desc || desc || '', 15));
      document.getElementById('drawer').innerHTML = `<div class="drawer-head"><div><h3>${safeTitle} Tutorial</h3><p>${safeDesc}</p></div><button class="btn icon" onclick="closeTutorialDrawer()"><i data-lucide="x"></i></button></div>
        <div class="tutorial-video"><div class="tutorial-video-inner"><i data-lucide="play-circle"></i><strong>Video tutorial placeholder</strong><span>The official setup video will be assigned from the Super Admin dashboard.</span></div></div>
        <div class="section-head" style="margin-bottom:12px"><div><h3>Setup and operation guide</h3><p>Simple steps for configuring and using this module effectively.</p></div></div>
        <div class="tutorial-guidelines module-guide-mini">${(bp.workflow || []).map((step,index)=>`<div class="tutorial-step"><div class="tutorial-step-number">${index+1}</div><div><strong>${step[0]}</strong><span>${step[1]}</span></div></div>`).join('')}</div>
        <div style="border-top:1px solid var(--line);margin-top:18px;padding-top:16px"><h3 style="margin:0 0 10px;font-size:15px">Key module functions</h3><div class="module-feature-grid">${(bp.features || []).slice(0,4).map(moduleFeatureCard).join('')}</div></div>
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:22px"><button class="btn" onclick="closeTutorialDrawer()">Close</button><button class="btn primary" onclick="showToast('${escapeJs(title)} tutorial opened.');closeTutorialDrawer()"><i data-lucide="check"></i>Got it</button></div>`;
      document.getElementById('drawerOverlay').classList.add('show'); lucide.createIcons();
    }
    function openDrawer(title, desc) {
      document.getElementById('drawer').innerHTML = `<div class="drawer-head"><div><h3>${title}</h3><p>${desc}</p></div><button class="btn icon" onclick="closeTutorialDrawer()"><i data-lucide="x"></i></button></div><div class="settings-stack">${setting('Dashboard preview enabled','Tenant staff can configure this module before public activation.',true)}${setting('Public website visibility','Controls whether this module appears on the live website and mobile app.',false)}${setting('Audit log tracking','Record updates, permission changes, and risky actions.',true)}${setting('Notification automation','Send reminders, alerts, and digest messages.',true)}</div><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:22px"><button class="btn">Cancel</button><button class="btn primary" onclick="showToast('${title} settings saved.');closeTutorialDrawer()">Save Changes</button></div>`;
      document.getElementById('drawerOverlay').classList.add('show'); lucide.createIcons();
    }
    function closeDrawer(e){ if(e.target.id==='drawerOverlay') e.currentTarget.classList.remove('show'); }
    function showModal(title, body, action='Save') {
      document.getElementById('modal').innerHTML = `<div class="modal-head"><h3>${title}</h3><button class="btn icon" onclick="document.getElementById('modalOverlay').classList.remove('show')"><i data-lucide="x"></i></button></div><div class="modal-body">${body}</div><div class="modal-foot"><button class="btn" onclick="document.getElementById('modalOverlay').classList.remove('show')">Cancel</button><button class="btn primary" onclick="showToast('${title} completed.');document.getElementById('modalOverlay').classList.remove('show')">${action}</button></div>`;
      document.getElementById('modalOverlay').classList.add('show'); lucide.createIcons();
    }
    function closeModal(e){ if(e.target.id==='modalOverlay') e.currentTarget.classList.remove('show'); }
    function openNewPageModal(){ showModal('Create New Page', `<div class="form-grid"><div><label>Page Title</label><input placeholder="e.g. Prayer & Testimonies"></div><div><label>Template</label><select><option>Landing Page</option><option>Ministry Page</option><option>Service Page</option></select></div></div><div style="margin-top:16px"><label>Description</label><textarea placeholder="Describe the page purpose..."></textarea></div>`, 'Create Page'); }
    function openPrayerSessionModal(){ showModal('Create Prayer Session', `<div class="form-grid"><div><label>Session Title</label><input value="5:00 AM Morning Prayer"></div><div><label>Schedule</label><select><option>Every weekday</option><option>Weekly</option><option>Custom recurrence</option></select></div><div><label>Prayer Leader</label><input value="Pastor David"></div><div><label>Reminder Channels</label><select><option>Push, SMS, Email</option><option>Push only</option><option>Email only</option></select></div></div><div style="margin-top:16px"><label>Prayer Focus</label><textarea>Scripture-based prayer points, background music, leader broadcast, and I Prayed tracking.</textarea></div>`, 'Create Session'); }
    function openQuickAction(){ showModal('Quick Action', `<div class="grid module-grid" style="grid-template-columns:1fr 1fr"><button class="card" onclick="openNewPageModal()"><strong>New Page</strong><p style="color:var(--muted)">Create a churchfront page.</p></button><button class="card" onclick="openPrayerSessionModal()"><strong>New Prayer Room</strong><p style="color:var(--muted)">Schedule corporate prayer.</p></button><button class="card"><strong>Invite Staff</strong><p style="color:var(--muted)">Add team member access.</p></button><button class="card"><strong>Upload Media</strong><p style="color:var(--muted)">Add sermons or clips.</p></button></div>`, 'Done'); }
    function openChurchSwitcher(){ showModal('Switch Church Context', `<div class="list"><button class="list-item" onclick="setChurch('Lagos Central Campus')"><div class="list-icon"><i data-lucide="church"></i></div><div><strong>Lagos Central Campus</strong><span>Primary tenant workspace.</span></div></button><button class="list-item" onclick="setChurch('Abuja Worship Center')"><div class="list-icon"><i data-lucide="church"></i></div><div><strong>Abuja Worship Center</strong><span>Branch preview workspace.</span></div></button><button class="list-item" onclick="setChurch('Nairobi Online Campus')"><div class="list-icon"><i data-lucide="church"></i></div><div><strong>Nairobi Online Campus</strong><span>Online-only campus.</span></div></button></div>`, 'Close'); }
    function setChurch(name){ state.church=name; document.getElementById('contextChurchName').textContent=name; document.getElementById('modalOverlay').classList.remove('show'); showToast(`Church context changed to ${name}.`); }
    function showToast(message){ const t=document.getElementById('toast'); t.textContent=message; t.classList.remove('hidden'); clearTimeout(window.toastTimer); window.toastTimer=setTimeout(()=>t.classList.add('hidden'),2600); }

    init();
  </script>
